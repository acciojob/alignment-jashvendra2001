
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Assignment 3</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
    }

    table {
      border: 1px solid black;
      border-spacing: 1px;
      margin: 20px auto;
    }

    td {
      border: 1px solid black;
      padding: 1px;
      width: 60px;
      height: 30px;
    }

    .middle {
      margin-left: auto;
      margin-right: auto;
    }

    .center {
      text-align: center;
    }

    .right {
      text-align: right;
    }

    .green {
      background-color: green;
    }

    .blue {
      background-color: blue;
    }

    #table-3 {
      width: 300px;
    }

    #t-image {
      text-align: center;
    }

    #t-image img {
      width: 200px;
      height: auto;
    }
  </style>
</head>

<body>

  <h1>HTML Assignment #3</h1>

  <!-- Table 1 -->
  <table id="table-1" class="middle">
    <tr>
      <td id="t11">left</td>
      <td>center</td>
      <td class="right">right</td>
    </tr>

    <tr class="center">
      <td id="t12">left</td>
      <td>center</td>
      <td class="right">right</td>
    </tr>

    <tr>
      <td id="t13">left</td>
      <td>center</td>
      <td class="right">right</td>
    </tr>
  </table>

  <!-- Table 2 -->
  <table id="table-2" class="middle">
    <tr>
      <td id="t21" colspan="6">1</td>
    </tr>

    <tr>
      <td colspan="3">2</td>
      <td colspan="3">3</td>
    </tr>

    <tr>
      <td colspan="2">4</td>
      <td colspan="2">5</td>
      <td colspan="2">6</td>
    </tr>

    <tr>
      <td>7</td>
      <td>8</td>
      <td>9</td>
      <td>10</td>
      <td>11</td>
      <td>12</td>
    </tr>

    <tr>
      <td>13</td>
      <td>14</td>
      <td>15</td>
      <td>16</td>
      <td>17</td>
      <td>18</td>
    </tr>

    <tr>
      <td>19</td>
      <td>20</td>
      <td>21</td>
      <td>22</td>
      <td>23</td>
      <td>24</td>
    </tr>
  </table>

  <!-- Table 3 -->
  <table id="table-3" class="middle">
    <tr class="green">
      <td>&nbsp;</td>
    </tr>

    <tr>
      <td id="t-image">
        <img
          src="https://www2.d125.org/applied_arts/teched/courses/WEB/portfolios/2013_FallP3/Luthra%20Portfolio/images-1.jpeg"
          alt="HTML Table Image"
        >
      </td>
    </tr>

    <tr class="blue">
      <td>&nbsp;</td>
    </tr>
  </table>

</body>
</html>
